[project]
name = "httpxic"
version = "0.1.0"
description = "Type-safe api client library built on top of httpx and pydantic"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = []
authors = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.2",
    "typing-extensions>=4.16.0",
]

[project.urls]
Documentation = "https://github.com/asynq-io/httpxic#readme"
Issues = "https://github.com/asynq-io/httpxic/issues"
Source = "https://github.com/asynq-io/httpxic"

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-instrumentation-httpx>=0.62b0",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    "ipython",
]

test = [
    "anyio",
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-repeat",
    "pytest-timeout",
    "respx>=0.23.1",
]

lint = [
    "mypy",
    "ruff",
    "bandit",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
timeout = 3
addopts = "--cov=./httpxic --cov-branch --cov-fail-under=100"
testpaths = ["./tests"]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.bandit]
skips = ['B101']

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
exclude = ["tests/"]

[tool.ruff]
target-version = "py310"

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "A002",
    "ANN401",
    "COM812",
    "CPY001",
    "D",
    "B008",     # do not perform function calls in argument defaults
    "E501",     # line too long
    "N818",
    "PTH123",
    "PLW2901"
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "SLF001", "PLR2004", "ARG002"]
"examples/*" = ["INP001"]
