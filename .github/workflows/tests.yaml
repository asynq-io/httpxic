name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  schedule:
    # cron every week on monday
    - cron: "0 0 * * 1"
  # allows other workflows (e.g. Publish) to gate on the full test suite
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
      - name: Install dependencies
        run: uv sync --locked --dev --all-extras
      - name: Check dependencies
        run: uv lock --check
      - name: Pytest
        run: uv run pytest -v --cov-report term-missing --cov-report xml:/tmp/coverage.xml --junitxml=/tmp/pytest.xml ./tests
      - name: Coverage Report
        if: matrix.python-version == '3.14' && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: /tmp/coverage.xml
          junitxml-path: /tmp/pytest.xml
      - name: Ruff
        if: matrix.python-version == '3.14'
        run: |
          uv run ruff check ./httpxic
          uv run ruff format ./httpxic --check
      - name: Mypy
        if: matrix.python-version == '3.14'
        run: uv run mypy ./httpxic
      - name: Bandit
        if: matrix.python-version == '3.14'
        run: uv run bandit --skip B101 -r ./httpxic

  test-core:
    name: "Core (no extras)"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Pytest
        run: uv run pytest -v ./tests --cov-fail-under=0
